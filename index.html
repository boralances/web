<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sisteme Geçiş Yapılıyor...</title>
    <style>
        /* Modern ve teknolojik bir yazı tipi */
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d12;
            background-image: radial-gradient(circle at 50% 50%, #1a1a24 0%, #0d0d12 100%);
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(20, 20, 30, 0.6);
            padding: 50px 70px;
            border-radius: 16px;
            border: 1px solid rgba(0, 255, 204, 0.2);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.1), inset 0 0 20px rgba(0, 255, 204, 0.05);
            backdrop-filter: blur(10px);
            animation: fadeIn 1s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        p {
            font-size: 1.2rem;
            color: #8c8c9a;
            margin-bottom: 35px;
        }

        /* Neon yükleme çemberi */
        .loader {
            width: 70px;
            height: 70px;
            border: 4px solid rgba(0, 255, 204, 0.1);
            border-top: 4px solid #00ffcc;
            border-radius: 50%;
            margin: 0 auto 30px auto;
            animation: spin 1s linear infinite, glow 2s alternate infinite;
        }

        /* Şık ve parlak buton */
        .btn {
            display: inline-block;
            padding: 12px 35px;
            color: #00ffcc;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border: 1px solid #00ffcc;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            background: transparent;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }

        .btn:hover {
            background: #00ffcc;
            color: #0d0d12;
            box-shadow: 0 0 25px #00ffcc;
            cursor: pointer;
        }

        /* Animasyonlar */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes glow {
            0% { box-shadow: 0 0 5px rgba(0,255,204,0.1); }
            100% { box-shadow: 0 0 25px rgba(0,255,204,0.5); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h1>Bağlantı Kuruluyor</h1>
        <p>Hedef sunucuya güvenli bir şekilde aktarıyorsunuz...</p>
        <a href="https://boralances.boranil400.workers.dev/" class="btn">Manuel Olarak Git</a>
    </div>

    <script>
        // Sayfa yüklendikten 3000 milisaniye (3 saniye) sonra yönlendirme yapar
        // İstersen bu süreyi kısaltabilir veya tamamen silebilirsin.
        setTimeout(function() {
            window.location.href = "https://boralances.boranil400.workers.dev/";
        }, 1500
                );
    </script>
</body>
</html>
