<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BORALANCES OS // MOUSE INTERACTIVE GATEWAY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cyan: #00f3ff;
            --magenta: #ff0055;
            --yellow: #ffe600;
            --green: #00ff88;
            --bg-dark: #02040a;
            --glass-bg: rgba(6, 11, 25, 0.75);
            --accent-glow: rgba(0, 243, 255, 0.4);
        }

        body[data-theme="obsidian"] {
            --cyan: #a855f7;
            --magenta: #ec4899;
            --accent-glow: rgba(168, 85, 247, 0.4);
        }
        body[data-theme="matrix"] {
            --cyan: #00ff88;
            --magenta: #00b894;
            --accent-glow: rgba(0, 255, 136, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            padding: 16px 12px;
        }

        @media (pointer: fine) {
            * { cursor: none; }
            #cyber-cursor {
                position: fixed;
                width: 26px;
                height: 26px;
                border: 2px solid var(--cyan);
                border-radius: 50%;
                pointer-events: none;
                z-index: 9999;
                transform: translate(-50%, -50%);
                mix-blend-mode: difference;
                transition: width 0.1s, height 0.1s, border-color 0.2s;
            }
            #cyber-cursor::after {
                content: '';
                position: absolute;
                top: 50%; left: 50%;
                width: 4px; height: 4px;
                background: var(--magenta);
                border-radius: 50%;
                transform: translate(-50%, -50%);
            }
            #cyber-cursor.active {
                width: 36px;
                height: 36px;
                border-color: var(--magenta);
            }
        }

        @media (pointer: coarse) {
            #cyber-cursor { display: none; }
        }

        #canvas-bg {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        .crt-scanlines {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        /* Özel Sağ Tık Cyberpunk HUD Bağlam Menüsü */
        #hud-context-menu {
            position: fixed;
            z-index: 10000;
            width: 200px;
            background: rgba(6, 11, 25, 0.9);
            backdrop-filter: blur(20px) saturate(200%);
            border: 1px solid var(--cyan);
            border-radius: 14px;
            padding: 8px;
            box-shadow: 0 0 25px var(--accent-glow);
            display: none;
            flex-direction: column;
            gap: 4px;
            transform: scale(0.95);
            opacity: 0;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        #hud-context-menu.visible {
            display: flex;
            transform: scale(1);
            opacity: 1;
        }

        .menu-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            color: var(--cyan);
            letter-spacing: 0.15em;
            padding: 6px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 4px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            color: #f8fafc;
            background: transparent;
            border: none;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .menu-item:hover {
            background: rgba(0, 243, 255, 0.15);
            color: var(--cyan);
            transform: translateX(4px);
        }

        .menu-item.danger:hover {
            background: rgba(255, 0, 85, 0.2);
            color: var(--magenta);
        }

        /* Sol Tık Şok Dalgası Efekti */
        .click-ripple {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid var(--cyan);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%) scale(0.5);
            animation: ripple-anim 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes ripple-anim {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(3.5); border-color: var(--magenta); }
        }

        /* Telemetri Barı */
        .telemetry-bar {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Fira Code', monospace;
            font-size: clamp(0.55rem, 2.5vw, 0.7rem);
            color: rgba(255, 255, 255, 0.6);
        }

        .telemetry-item {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Glass Container */
        .glass-portal {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            margin: auto;
            padding: 2px;
            border-radius: 28px;
            background: linear-gradient(135deg, var(--cyan), transparent 40%, var(--magenta));
            box-shadow: 0 0 30px var(--accent-glow);
            transition: transform 0.15s ease-out;
        }

        .glass-card {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 26px;
            padding: clamp(20px, 5vw, 32px) clamp(16px, 4vw, 24px);
            text-align: center;
            overflow: hidden;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .hud-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.55rem, 2.2vw, 0.65rem);
            letter-spacing: 0.1em;
            color: var(--cyan);
            background: rgba(0, 243, 255, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--cyan);
        }

        .hud-tag.aborted {
            color: var(--magenta);
            border-color: var(--magenta);
            background: rgba(255, 0, 85, 0.15);
        }

        .theme-selector {
            display: flex;
            gap: 8px;
        }
        .theme-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
        }

        .glitch-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.4rem, 6vw, 1.9rem);
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 12px var(--cyan);
            letter-spacing: 0.05em;
        }

        .subtitle {
            font-size: clamp(0.75rem, 3vw, 0.88rem);
            color: #94a3b8;
            margin-top: 4px;
            margin-bottom: 20px;
        }

        .reactor-box {
            position: relative;
            width: clamp(110px, 30vw, 140px);
            height: clamp(110px, 30vw, 140px);
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reactor-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .reactor-track { stroke: rgba(255, 255, 255, 0.05); stroke-width: 8; fill: none; }
        .reactor-fill {
            stroke: var(--cyan);
            stroke-width: 8; fill: none;
            stroke-linecap: round;
            stroke-dasharray: 377;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.3s ease, stroke 0.3s ease;
        }

        .reactor-core { position: absolute; display: flex; flex-direction: column; align-items: center; }
        .count-val {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.8rem, 8vw, 2.3rem);
            font-weight: 900;
            color: #fff;
            line-height: 1;
        }
        .count-unit {
            font-family: 'Fira Code', monospace;
            font-size: clamp(0.5rem, 2vw, 0.6rem);
            color: var(--cyan);
            letter-spacing: 0.15em;
            margin-top: 4px;
        }

        .control-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 16px;
        }

        .cyber-btn {
            padding: 12px 4px;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.6rem, 2.4vw, 0.68rem);
            font-weight: 700;
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            touch-action: manipulation;
            cursor: pointer;
        }

        .cyber-btn:active {
            transform: scale(0.96);
            background: rgba(0, 243, 255, 0.25);
        }

        .cyber-btn-stop {
            background: rgba(255, 0, 85, 0.1);
            border-color: rgba(255, 0, 85, 0.3);
            color: var(--magenta);
        }

        .cyber-btn-accent {
            background: linear-gradient(135deg, var(--cyan), var(--magenta));
            border: none;
        }

        .mouse-guide {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-family: 'Fira Code', monospace;
            font-size: 0.62rem;
            color: #64748b;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body>

    <div id="cyber-cursor"></div>
    <canvas id="canvas-bg"></canvas>
    <div class="crt-scanlines"></div>

    <div id="hud-context-menu">
        <div class="menu-title">HUD QUICK ACTIONS</div>
        <button class="menu-item" onclick="executeWarp()">⚡ WARP SPEED (GEÇ)</button>
        <button class="menu-item" onclick="togglePause()">⏸ DONDUR / DEVAM</button>
        <button class="menu-item" onclick="cycleTheme()">🎨 TEMA DEĞİŞTİR</button>
        <button class="menu-item danger" onclick="stopRedirect()">🛑 SİSTEMİ İPTAL ET</button>
    </div>

    <div class="telemetry-bar">
        <div class="telemetry-item">
            <span>FPS:</span> <span id="fps-val" style="color:var(--green)">60</span>
        </div>
        <div class="telemetry-item">
            <span>PING:</span> <span id="ping-val" style="color:var(--cyan)">12ms</span>
        </div>
        <div class="telemetry-item" onclick="toggleAudio()">
            <span>SFX:</span> <span id="sfx-status" style="color:var(--green)">ON</span>
        </div>
    </div>

    <div class="glass-portal" id="portal">
        <div class="glass-card" id="card">
            
            <div class="hud-header">
                <span class="hud-tag" id="hud-status">GATEWAY // ACTIVE</span>
                <div class="theme-selector">
                    <div class="theme-dot" style="background:#00f3ff" onclick="setTheme('default')"></div>
                    <div class="theme-dot" style="background:#a855f7" onclick="setTheme('obsidian')"></div>
                    <div class="theme-dot" style="background:#00ff88" onclick="setTheme('matrix')"></div>
                </div>
            </div>

            <h1 class="glitch-title">BORALANCES</h1>
            <p class="subtitle" id="status-desc">Cloudflare Worker Gateway yönlendirmesi</p>

            <div class="reactor-box">
                <svg class="reactor-svg" viewBox="0 0 140 140">
                    <circle class="reactor-track" cx="70" cy="70" r="60"></circle>
                    <circle class="reactor-fill" id="reactor-fill" cx="70" cy="70" r="60"></circle>
                </svg>
                <div class="reactor-core">
                    <span class="count-val" id="count-val">3</span>
                    <span class="count-unit" id="count-unit">SECONDS</span>
                </div>
            </div>

            <div class="control-panel">
                <button class="cyber-btn" id="pause-btn" onclick="togglePause()">
                    <span id="pause-icon">⏸</span>
                    <span id="pause-txt">DONDUR</span>
                </button>
                
                <button class="cyber-btn cyber-btn-stop" id="stop-btn" onclick="stopRedirect()">
                    <span>🛑</span>
                    <span>İPTAL ET</span>
                </button>

                <button class="cyber-btn cyber-btn-accent" onclick="executeWarp()">
                    <span>⚡</span>
                    <span>GEÇ</span>
                </button>
            </div>

            <a href="admin.html" style="color:#64748b; font-family:'Orbitron'; font-size:0.65rem; text-decoration:none; letter-spacing:0.1em" onclick="playSfx('click')">
                [ ADMIN PORTAL ]
            </a>

            <div class="mouse-guide">
                <span>🖱 Sol Tık: Şok Dalgası</span>
                <span>🖱 Sağ Tık: HUD Menü</span>
            </div>

        </div>
    </div>

    <script>
        const targetURL = "https://boralances.boranil400.workers.dev/";
        let timeLeft = 3;
        let totalTime = 3;
        let isPaused = false;
        let isStopped = false;
        let audioEnabled = true;
        let currentThemeIndex = 0;
        const themes = ['default', 'obsidian', 'matrix'];

        function triggerHaptic() {
            if ("vibrate" in navigator) navigator.vibrate(15);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(type) {
            triggerHaptic();
            if (!audioEnabled) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'beep') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
                osc.start(); osc.stop(audioCtx.currentTime + 0.06);
            } else if (type === 'menu') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'stop') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'warp') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Sol Tık Şok Dalgası Mantığı
        document.addEventListener('pointerdown', (e) => {
            // Sağ tık değilse şok dalgası üret
            if (e.button !== 2) {
                const ripple = document.createElement('div');
                ripple.className = 'click-ripple';
                ripple.style.left = e.clientX + 'px';
                ripple.style.top = e.clientY + 'px';
                document.body.appendChild(ripple);
                
                playSfx('click');

                setTimeout(() => ripple.remove(), 500);

                // HUD Menüsünü kapat
                hideContextMenu();
            }
        });

        // Sağ Tık Özel Bağlam Menüsü Mantığı
        const contextMenu = document.getElementById('hud-context-menu');
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            playSfx('menu');

            let x = e.clientX;
            let y = e.clientY;

            // Ekran sınırlarını aşmasını önle
            if (x + 200 > window.innerWidth) x = window.innerWidth - 210;
            if (y + 160 > window.innerHeight) y = window.innerHeight - 170;

            contextMenu.style.left = x + 'px';
            contextMenu.style.top = y + 'px';
            contextMenu.classList.add('visible');
        });

        function hideContextMenu() {
            contextMenu.classList.remove('visible');
        }

        function executeWarp() {
            hideContextMenu();
            playSfx('warp');
            setTimeout(() => window.location.href = targetURL, 150);
        }

        function cycleTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            setTheme(themes[currentThemeIndex]);
            hideContextMenu();
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            document.getElementById('sfx-status').textContent = audioEnabled ? 'ON' : 'OFF';
            document.getElementById('sfx-status').style.color = audioEnabled ? 'var(--green)' : 'var(--magenta)';
        }

        function setTheme(theme) {
            playSfx('click');
            if (theme === 'default') document.body.removeAttribute('data-theme');
            else document.body.setAttribute('data-theme', theme);
        }

        const countVal = document.getElementById('count-val');
        const countUnit = document.getElementById('count-unit');
        const reactorFill = document.getElementById('reactor-fill');
        const hudStatus = document.getElementById('hud-status');
        const statusDesc = document.getElementById('status-desc');
        const pauseTxt = document.getElementById('pause-txt');
        const pauseIcon = document.getElementById('pause-icon');
        const circumference = 377;

        const timer = setInterval(() => {
            if (!isPaused && !isStopped) {
                timeLeft--;
                countVal.textContent = timeLeft;
                playSfx('beep');

                const offset = circumference - (timeLeft / totalTime) * circumference;
                reactorFill.style.strokeDashoffset = offset;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    executeWarp();
                }
            }
        }, 1000);

        function togglePause() {
            if (isStopped) return;
            isPaused = !isPaused;
            hideContextMenu();
            playSfx('click');

            if (isPaused) {
                pauseTxt.textContent = "DEVAM";
                pauseIcon.textContent = "▶";
                hudStatus.textContent = "GATEWAY // PAUSED";
                statusDesc.textContent = "Zamanlayıcı donduruldu";
                reactorFill.style.stroke = "var(--yellow)";
            } else {
                pauseTxt.textContent = "DONDUR";
                pauseIcon.textContent = "⏸";
                hudStatus.textContent = "GATEWAY // ACTIVE";
                statusDesc.textContent = "Cloudflare Worker Gateway yönlendirmesi";
                reactorFill.style.stroke = "var(--cyan)";
            }
        }

        function stopRedirect() {
            if (isStopped) return;
            isStopped = true;
            clearInterval(timer);
            hideContextMenu();
            playSfx('stop');

            hudStatus.textContent = "GATEWAY // ABORTED";
            hudStatus.classList.add('aborted');
            statusDesc.textContent = "Yönlendirme iptal edildi.";
            statusDesc.style.color = "var(--magenta)";

            countVal.textContent = "OFF";
            countVal.style.color = "var(--magenta)";
            countUnit.textContent = "CANCELLED";
            countUnit.style.color = "var(--magenta)";

            reactorFill.style.strokeDashoffset = circumference;
            reactorFill.style.stroke = "var(--magenta)";
        }

        // Pointer/Cursor Takibi
        const cursor = document.getElementById('cyber-cursor');
        const portal = document.getElementById('portal');

        window.addEventListener('pointermove', (e) => {
            if (cursor && window.matchMedia('(pointer: fine)').matches) {
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
            }

            const xAxis = (window.innerWidth / 2 - e.clientX) / 30;
            const yAxis = (window.innerHeight / 2 - e.clientY) / 30;
            portal.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Background Animation
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let lastTime = performance.now();
        let frameCount = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < (window.innerWidth < 480 ? 90 : 160); i++) {
            stars.push({
                x: (Math.random() - 0.5) * canvas.width * 2,
                y: (Math.random() - 0.5) * canvas.height * 2,
                z: Math.random() * canvas.width
            });
        }

        function render(now) {
            frameCount++;
            if (now - lastTime >= 1000) {
                document.getElementById('fps-val').textContent = frameCount;
                document.getElementById('ping-val').textContent = Math.floor(Math.random() * 4 + 10) + 'ms';
                frameCount = 0;
                lastTime = now;
            }

            ctx.fillStyle = "rgba(2, 4, 10, 0.35)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            stars.forEach(s => {
                s.z -= isPaused || isStopped ? 0.6 : 3.5;
                if (s.z <= 0) s.z = canvas.width;

                const k = 128 / s.z;
                const px = s.x * k + cx;
                const py = s.y * k + cy;

                if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                    const size = (1 - s.z / canvas.width) * 2.2;
                    ctx.beginPath();
                    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--cyan');
                    ctx.arc(px, py, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
    </script>
</body>
</html>
