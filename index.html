<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BORALANCES OS // ULTIMATE HUD v7.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    
    <style>
        @property --border-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        :root {
            --bg-dark: #030712;
            --accent-cyan: #00f0ff;
            --accent-purple: #a855f7;
            --accent-pink: #ff2a6d;
            --accent-amber: #f59e0b;
            --accent-green: #10b981;
            
            --primary: var(--accent-cyan);
            --secondary: var(--accent-purple);
            --danger: var(--accent-pink);
            
            --glass-bg: rgba(8, 14, 28, 0.78);
            --glass-border: rgba(255, 255, 255, 0.12);
            --card-glow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 240, 255, 0.2);
            
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-tech: 'Orbitron', sans-serif;
            --font-code: 'Fira Code', monospace;
        }

        body[data-theme="obsidian"] {
            --primary: #c084fc;
            --secondary: #f43f5e;
            --glass-bg: rgba(18, 10, 26, 0.8);
            --card-glow: 0 30px 60px rgba(0, 0, 0, 0.85), 0 0 40px rgba(192, 132, 252, 0.25);
        }
        body[data-theme="matrix"] {
            --primary: #10b981;
            --secondary: #06b6d4;
            --glass-bg: rgba(6, 20, 15, 0.8);
            --card-glow: 0 30px 60px rgba(0, 0, 0, 0.85), 0 0 40px rgba(16, 185, 129, 0.25);
        }
        body[data-theme="amber"] {
            --primary: #fbbf24;
            --secondary: #f97316;
            --glass-bg: rgba(22, 16, 10, 0.8);
            --card-glow: 0 30px 60px rgba(0, 0, 0, 0.85), 0 0 40px rgba(251, 191, 36, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: var(--font-main);
            color: #f8fafc;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* custom cursor (Masaüstü) */
        @media (pointer: fine) {
            * { cursor: none !important; }
            #cyber-cursor {
                position: fixed;
                width: 20px;
                height: 20px;
                border: 2px solid var(--primary);
                border-radius: 50%;
                pointer-events: none;
                z-index: 9999;
                transform: translate(-50%, -50%);
                transition: width 0.15s, height 0.15s, border-color 0.2s, background-color 0.2s;
            }
            #cyber-cursor::after {
                content: '';
                position: absolute;
                top: 50%; left: 50%;
                width: 4px; height: 4px;
                background: var(--secondary);
                border-radius: 50%;
                transform: translate(-50%, -50%);
            }
            #cyber-cursor.hovering {
                width: 38px;
                height: 38px;
                border-color: var(--primary);
                background: rgba(0, 240, 255, 0.1);
            }
        }

        @media (pointer: coarse) {
            #cyber-cursor { display: none !important; }
        }

        #canvas-bg {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        /* Telemetri & Mini Grafik Barı */
        .telemetry-bar {
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            left: 12px; right: 12px;
            z-index: 30;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-code);
            font-size: clamp(0.6rem, 2.2vw, 0.72rem);
        }

        .telemetry-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(10, 16, 30, 0.7);
            backdrop-filter: blur(16px);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .sys-graph {
            width: 36px;
            height: 12px;
            display: flex;
            align-items: flex-end;
            gap: 2px;
        }
        .sys-bar {
            flex: 1;
            background: var(--primary);
            border-radius: 1px;
            transition: height 0.2s ease;
        }

        /* Dynamic Animated Border Card Wrapper */
        .portal-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            padding: 0 12px;
            perspective: 1000px;
        }

        .animated-border-box {
            position: relative;
            border-radius: 32px;
            padding: 2px;
            background: conic-gradient(from var(--border-angle), transparent 20%, var(--primary), var(--secondary), transparent 80%);
            animation: rotateBorder 6s linear infinite;
            box-shadow: var(--card-glow);
            transition: box-shadow 0.4s ease;
        }

        @keyframes rotateBorder {
            to { --border-angle: 360deg; }
        }

        .glass-card {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(35px) saturate(210%);
            -webkit-backdrop-filter: blur(35px) saturate(210%);
            border-radius: 30px;
            padding: clamp(24px, 5vw, 36px) clamp(18px, 4.5vw, 28px);
            text-align: center;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        /* Ambient Glow Dynamic Spotlight */
        .card-spotlight {
            position: absolute;
            inset: 0;
            background: radial-gradient(600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,0.08), transparent 40%);
            pointer-events: none;
        }

        /* Header UI */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .hud-badge {
            font-family: var(--font-tech);
            font-size: clamp(0.58rem, 2vw, 0.65rem);
            font-weight: 800;
            letter-spacing: 0.12em;
            color: var(--primary);
            background: rgba(255, 255, 255, 0.04);
            padding: 5px 12px;
            border-radius: 10px;
            border: 1px solid var(--primary);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.15);
        }

        .hud-badge.aborted {
            color: var(--danger);
            border-color: var(--danger);
            box-shadow: 0 0 12px rgba(255, 42, 109, 0.25);
        }

        .cmd-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #94a3b8;
            padding: 5px 10px;
            border-radius: 10px;
            font-family: var(--font-code);
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cmd-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

        .main-title {
            font-family: var(--font-tech);
            font-size: clamp(1.7rem, 6.8vw, 2.3rem);
            font-weight: 900;
            letter-spacing: 0.05em;
            color: #ffffff;
            text-shadow: 0 0 20px var(--primary);
            margin-bottom: 4px;
        }

        .sub-title {
            font-size: clamp(0.8rem, 2.8vw, 0.92rem);
            color: #94a3b8;
            margin-bottom: 22px;
        }

        /* Reactor Progress Bar */
        .reactor-container {
            position: relative;
            width: clamp(120px, 32vw, 150px);
            height: clamp(120px, 32vw, 150px);
            margin: 0 auto 24px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reactor-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .reactor-track { stroke: rgba(255, 255, 255, 0.06); stroke-width: 7; fill: none; }
        .reactor-progress {
            stroke: var(--primary);
            stroke-width: 7;
            fill: none;
            stroke-linecap: round;
            stroke-dasharray: 377;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.3s ease, stroke 0.3s ease;
            filter: drop-shadow(0 0 10px var(--primary));
        }

        .reactor-core { position: absolute; display: flex; flex-direction: column; align-items: center; }
        .count-number {
            font-family: var(--font-tech);
            font-size: clamp(2.1rem, 8.5vw, 2.7rem);
            font-weight: 900;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 18px var(--primary);
        }
        .count-label {
            font-family: var(--font-code);
            font-size: clamp(0.55rem, 2vw, 0.65rem);
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.2em;
            margin-top: 6px;
        }

        /* Magnetic Buttons Grid */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-magnetic {
            position: relative;
            min-height: 50px;
            padding: 10px 8px;
            border-radius: 14px;
            font-family: var(--font-tech);
            font-size: clamp(0.62rem, 2.3vw, 0.72rem);
            font-weight: 800;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            touch-action: manipulation;
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.2s, border-color 0.2s;
        }

        .btn-magnetic:active { transform: scale(0.94) !important; }

        .btn-danger {
            background: rgba(255, 42, 109, 0.08);
            border-color: rgba(255, 42, 109, 0.25);
            color: var(--danger);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: #000;
            font-weight: 900;
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.35);
        }

        /* Command Palette Modal */
        #command-palette {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(2, 6, 16, 0.82);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        #command-palette.active {
            opacity: 1;
            pointer-events: auto;
        }

        .cmd-modal {
            width: 100%;
            max-width: 420px;
            background: rgba(12, 18, 34, 0.95);
            border: 1px solid var(--primary);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px var(--primary);
        }

        .cmd-input-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-family: var(--font-code);
            font-size: 0.9rem;
            outline: none;
            margin-bottom: 12px;
        }
        .cmd-input-box:focus { border-color: var(--primary); }

        .cmd-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 240px;
            overflow-y: auto;
        }

        .cmd-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            font-family: var(--font-main);
            font-size: 0.8rem;
            font-weight: 600;
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cmd-item:hover { background: rgba(0, 240, 255, 0.15); color: var(--primary); }

        /* Gestures Indicator on Mobile */
        .mobile-gestures-hint {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-family: var(--font-code);
            font-size: 0.62rem;
            color: #64748b;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Shockwave Ripple Effect */
        .click-ripple {
            position: fixed;
            width: 12px;
            height: 12px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%) scale(1);
            animation: ripple-out 0.45s cubic-bezier(0, 0, 0.2, 1) forwards;
        }

        @keyframes ripple-out {
            100% { opacity: 0; transform: translate(-50%, -50%) scale(6); border-color: var(--secondary); }
        }
    </style>
</head>
<body>

    <div id="cyber-cursor"></div>
    <canvas id="canvas-bg"></canvas>

    <div class="telemetry-bar">
        <div class="telemetry-pill">
            <span style="color:#64748b">SYS:</span>
            <div class="sys-graph">
                <div class="sys-bar" id="b1" style="height:40%"></div>
                <div class="sys-bar" id="b2" style="height:70%"></div>
                <div class="sys-bar" id="b3" style="height:50%"></div>
            </div>
            <span id="fps-txt" style="color:#fff; font-weight:700">60 FPS</span>
        </div>

        <div class="telemetry-pill" onclick="toggleAudio()" style="cursor:pointer">
            <span>SFX: <strong id="sfx-status" style="color:var(--accent-green)">ON</strong></span>
        </div>
    </div>

    <div id="command-palette">
        <div class="cmd-modal">
            <input type="text" class="cmd-input-box" id="cmd-search" placeholder="Komut arayın veya yazın... (Örn: tema, dondur)">
            <div class="cmd-list">
                <div class="cmd-item" onclick="triggerWarp()"><span>⚡ Anında Geçiş yap (Warp)</span> <kbd>[Enter]</kbd></div>
                <div class="cmd-item" onclick="togglePause()"><span>⏸ Dondur / Devam Et</span> <kbd>[Space]</kbd></div>
                <div class="cmd-item" onclick="cycleTheme()"><span>🎨 Temayı Değiştir</span> <kbd>[T]</kbd></div>
                <div class="cmd-item" onclick="abortProcess()"><span>🛑 İşlemi İptal Et</span> <kbd>[Esc]</kbd></div>
            </div>
        </div>
    </div>

    <div class="portal-wrapper">
        <div class="animated-border-box" id="card-box">
            <div class="glass-card" id="glass-card">
                <div class="card-spotlight" id="spotlight"></div>
                
                <div class="hud-header">
                    <span class="hud-badge" id="hud-status">GATEWAY // AKTİF</span>
                    <button class="cmd-btn" onclick="openCmdPalette()">Ctrl + K</button>
                </div>

                <h1 class="main-title">BORALANCES</h1>
                <p class="sub-title" id="status-desc">Cloudflare Worker Gateway yönlendirmesi</p>

                <div class="reactor-container">
                    <svg class="reactor-svg" viewBox="0 0 140 140">
                        <circle class="reactor-track" cx="70" cy="70" r="60"></circle>
                        <circle class="reactor-progress" id="reactor-progress" cx="70" cy="70" r="60"></circle>
                    </svg>
                    <div class="reactor-core">
                        <span class="count-number" id="count-val">3</span>
                        <span class="count-label" id="count-unit">SANİYE</span>
                    </div>
                </div>

                <div class="action-grid">
                    <button class="btn-magnetic" id="pause-btn" onclick="togglePause()">
                        <span id="pause-icon">⏸</span>
                        <span id="pause-txt">DONDUR</span>
                    </button>
                    
                    <button class="btn-magnetic btn-danger" onclick="abortProcess()">
                        <span>🛑</span>
                        <span>İPTAL ET</span>
                    </button>

                    <button class="btn-magnetic btn-primary" onclick="triggerWarp()">
                        <span>⚡</span>
                        <span>GEÇ</span>
                    </button>
                </div>

                <a href="admin.html" style="color:#64748b; font-family:'Orbitron'; font-size:0.65rem; text-decoration:none; letter-spacing:0.1em" onclick="playSfx('click')">
                    [ ADMIN PORTAL ]
                </a>

                <div class="mobile-gestures-hint">
                    <span>📱 Kaydır: ⬆ Geç | ⬇ İptal | ➡ Tema</span>
                </div>

            </div>
        </div>
    </div>

    <script>
        const TARGET_URL = "https://boralances.boranil400.workers.dev/";
        let timeLeft = 3;
        let totalTime = 3;
        let isPaused = false;
        let isAborted = false;
        let audioActive = true;

        const themes = ['default', 'obsidian', 'matrix', 'amber'];
        let currentThemeIdx = 0;

        // Web Audio Synthesizer Engine
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function triggerHaptic(ms = 15) {
            if ("vibrate" in navigator) navigator.vibrate(ms);
        }

        function playSfx(type) {
            triggerHaptic();
            if (!audioActive) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'beep') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.03, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                osc.start(); osc.stop(now + 0.08);
            } else if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1200, now);
                gain.gain.setValueAtTime(0.04, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(); osc.stop(now + 0.05);
            } else if (type === 'abort') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.25);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.start(); osc.stop(now + 0.25);
            } else if (type === 'warp') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(280, now);
                osc.frequency.exponentialRampToValueAtTime(1600, now + 0.3);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(); osc.stop(now + 0.3);
            }
        }

        function toggleAudio() {
            audioActive = !audioActive;
            const el = document.getElementById('sfx-status');
            el.textContent = audioActive ? 'ON' : 'OFF';
            el.style.color = audioActive ? 'var(--accent-green)' : 'var(--accent-pink)';
            playSfx('click');
        }

        // Timer Logic
        const countVal = document.getElementById('count-val');
        const countUnit = document.getElementById('count-unit');
        const reactorProgress = document.getElementById('reactor-progress');
        const hudStatus = document.getElementById('hud-status');
        const statusDesc = document.getElementById('status-desc');
        const pauseTxt = document.getElementById('pause-txt');
        const pauseIcon = document.getElementById('pause-icon');
        const CIRCUMFERENCE = 377;

        const timer = setInterval(() => {
            if (!isPaused && !isAborted) {
                timeLeft--;
                countVal.textContent = timeLeft;
                playSfx('beep');

                const offset = CIRCUMFERENCE - (timeLeft / totalTime) * CIRCUMFERENCE;
                reactorProgress.style.strokeDashoffset = offset;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    triggerWarp();
                }
            }
        }, 1000);

        function togglePause() {
            if (isAborted) return;
            isPaused = !isPaused;
            playSfx('click');

            if (isPaused) {
                pauseTxt.textContent = "DEVAM";
                pauseIcon.textContent = "▶";
                hudStatus.textContent = "GATEWAY // PAUSED";
                statusDesc.textContent = "Zamanlayıcı duraklatıldı";
                reactorProgress.style.stroke = "var(--accent-amber)";
            } else {
                pauseTxt.textContent = "DONDUR";
                pauseIcon.textContent = "⏸";
                hudStatus.textContent = "GATEWAY // AKTİF";
                statusDesc.textContent = "Cloudflare Worker Gateway yönlendirmesi";
                reactorProgress.style.stroke = "var(--primary)";
            }
        }

        function abortProcess() {
            if (isAborted) return;
            isAborted = true;
            clearInterval(timer);
            playSfx('abort');

            hudStatus.textContent = "GATEWAY // İPTAL EDİLDİ";
            hudStatus.classList.add('aborted');
            statusDesc.textContent = "Yönlendirme iptal edildi.";
            statusDesc.style.color = "var(--danger)";

            countVal.textContent = "OFF";
            countVal.style.color = "var(--danger)";
            countUnit.textContent = "CANCELLED";
            countUnit.style.color = "var(--danger)";

            reactorProgress.style.strokeDashoffset = CIRCUMFERENCE;
            reactorProgress.style.stroke = "var(--danger)";
        }

        function triggerWarp() {
            playSfx('warp');
            setTimeout(() => window.location.href = TARGET_URL, 180);
        }

        function cycleTheme() {
            currentThemeIdx = (currentThemeIdx + 1) % themes.length;
            const theme = themes[currentThemeIdx];
            if (theme === 'default') document.body.removeAttribute('data-theme');
            else document.body.setAttribute('data-theme', theme);
            playSfx('click');
        }

        // Command Palette Logic
        const cmdModal = document.getElementById('command-palette');
        function openCmdPalette() {
            cmdModal.classList.add('active');
            document.getElementById('cmd-search').focus();
            playSfx('click');
        }
        function closeCmdPalette() { cmdModal.classList.remove('active'); }

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                cmdModal.classList.contains('active') ? closeCmdPalette() : openCmdPalette();
            } else if (e.key === 'Escape') {
                closeCmdPalette();
            }
        });

        // 3D Magnetic & Tilt Lerp Engine
        const cardBox = document.getElementById('card-box');
        const glassCard = document.getElementById('glass-card');
        const spotlight = document.getElementById('spotlight');
        const cursor = document.getElementById('cyber-cursor');

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let cardX = 0, cardY = 0;

        window.addEventListener('pointermove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            if (cursor && window.matchMedia('(pointer: fine)').matches) {
                cursor.style.left = mouseX + 'px';
                cursor.style.top = mouseY + 'px';
            }

            const rect = glassCard.getBoundingClientRect();
            spotlight.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
            spotlight.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
        });

        // Magnetic Buttons Logic
        document.querySelectorAll('.btn-magnetic').forEach(btn => {
            btn.addEventListener('mousemove', (e) => {
                const rect = btn.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                btn.style.transform = `translate3d(${x * 0.25}px, ${y * 0.25}px, 0)`;
                if (cursor) cursor.classList.add('hovering');
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.transform = 'translate3d(0, 0, 0)';
                if (cursor) cursor.classList.remove('hovering');
            });
        });

        // Click Shockwave Effect
        document.addEventListener('pointerdown', (e) => {
            const ripple = document.createElement('div');
            ripple.className = 'click-ripple';
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            document.body.appendChild(ripple);
            playSfx('click');
            setTimeout(() => ripple.remove(), 450);
        });

        // Mobile Touch Gestures (Swipe Detection)
        let touchStartX = 0, touchStartY = 0;
        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: true});

        document.addEventListener('touchend', e => {
            const diffX = e.changedTouches[0].screenX - touchStartX;
            const diffY = e.changedTouches[0].screenY - touchStartY;

            if (Math.abs(diffY) > Math.abs(diffX)) {
                if (diffY < -60) triggerWarp(); // Swipe Up -> Warp
                else if (diffY > 60) abortProcess(); // Swipe Down -> Cancel
            } else {
                if (Math.abs(diffX) > 60) cycleTheme(); // Swipe Horizontal -> Theme
            }
        }, {passive: true});

        // Canvas Starfield Engine
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < (window.innerWidth < 480 ? 70 : 130); i++) {
            stars.push({
                x: (Math.random() - 0.5) * canvas.width * 2,
                y: (Math.random() - 0.5) * canvas.height * 2,
                z: Math.random() * canvas.width
            });
        }

        function render() {
            // Smooth Card Tilt Interpolation
            const targetX = (window.innerWidth / 2 - mouseX) / 35;
            const targetY = (window.innerHeight / 2 - mouseY) / 35;
            cardX += (targetX - cardX) * 0.1;
            cardY += (targetY - cardY) * 0.1;
            cardBox.style.transform = `rotateY(${cardX}deg) rotateX(${-cardY}deg)`;

            // Mini Sys Graph Animation
            document.getElementById('b1').style.height = `${30 + Math.random() * 50}%`;
            document.getElementById('b2').style.height = `${40 + Math.random() * 50}%`;
            document.getElementById('b3').style.height = `${20 + Math.random() * 60}%`;

            ctx.fillStyle = "rgba(3, 7, 18, 0.4)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            stars.forEach(s => {
                s.z -= isPaused || isStopped ? 0.6 : 3.5;
                if (s.z <= 0) s.z = canvas.width;

                const k = 128 / s.z;
                const px = s.x * k + cx;
                const py = s.y * k + cy;

                if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                    const size = (1 - s.z / canvas.width) * 2.2;
                    ctx.beginPath();
                    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--primary');
                    ctx.arc(px, py, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
    </script>
</body>
</html>
